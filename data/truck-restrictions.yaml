schema_name: Truck restrictions
schema_description: Truck road restriction from OpenStreetMap
attribution: '<a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>'
sources:
  osm:
    type: osm
    local_path: /data/truck-restrictions-pbf/merge.osm.pbf

layers:
  - id: restrictions
    features:
      - source: osm
        geometry: point_on_line
        min_zoom:
          default_value: 13
          overrides:
            - value: 7
              if:
                highway: [motorway, motorway_link, trunk, trunk_link, primary, primary_link]
            - value: 9
              if:
                highway: [secondary, secondary_link]
            - value: 11
              if:
                highway: [tertiary, tertiary_link]
            - value: 12
              if:
                highway: [residential, unclassified]

        include_when: &include_when
          __all__:
            - highway: [motorway, motorway_link, trunk, trunk_link, primary, primary_link, secondary, secondary_link, tertiary, tertiary_link, residential, unclassified]
            - __any__:
              goods:
              "goods:conditional":
              hgv:
              "hgv:conditional":

              maxweight:
              "maxweight:conditional":
              maxweightrating:
              "maxweightrating:conditional":

              maxlength:
              "maxlength:conditional":

              maxheight:
              "maxheight:conditional":
              "maxheight:physical":

              width:
              est_width:
              maxwidth:
              "maxwidth:conditional":
              "maxwidth:physical":

        exclude_when: &exclude_when
          __all__:
            - goods: [yes, ""]
            - hgv: [yes, ""]
            - maxweight: [default, ""]
            - maxweightrating: [default, ""]
            - maxlength: [default, ""]
            - maxheight: [default, ""]
            - "maxheight:physical": [default, ""]
            - width: [default, "", narrow]
            - est_width: [default, "", narrow]
            - maxwidth: [default, ""]
            - "maxwidth:physical": [default, ""]

        attributes: &attributes
          - key: highway

          - key: goods
            exclude_when:
              goods: yes
          - key: "goods:conditional"
          - key: hgv
            exclude_when:
              hgv: yes
          - key: "hgv:conditional"

          - key: maxweight
            value: >
              ${ min([
              double(coalesce(nullif(feature.tags.getOrDefault('maxweight', '').replaceRegex('[^0-9.]', ''), ''), 99.0)),
              double(coalesce(nullif(feature.tags.getOrDefault('maxweightrating', '').replaceRegex('[^0-9.]', ''), ''), 99.0))
              ]) }
            exclude_when: >
              ${ min([
              double(coalesce(nullif(feature.tags.getOrDefault('maxweight', '').replaceRegex('[^0-9.]', ''), ''), 99.0)),
              double(coalesce(nullif(feature.tags.getOrDefault('maxweightrating', '').replaceRegex('[^0-9.]', ''), ''), 99.0))
              ]) >= 44.0 }
            type: double
          - key: "maxweight:conditional"
            value: ${ coalesce(feature.tags.get('maxweight:conditional'), feature.tags.get('maxweightrating:conditional')) }

          - key: maxlength
            value: >
              ${ min([
                double(coalesce(nullif(feature.tags.getOrDefault('maxlength', '').replaceRegex('[^0-9.]', ''), ''), 99.0))
              ]) }
            exclude_when: >
              ${ min([
              double(coalesce(nullif(feature.tags.getOrDefault('maxlength', '').replaceRegex('[^0-9.]', ''), ''), 99.0))
              ]) >= 99.0 }
            type: double
          - key: "maxlength:conditional"

          - key: maxheight
            value: >
              ${ min([
              double(coalesce(nullif(feature.tags.getOrDefault('maxheight', '').replaceRegex('[^0-9.]', ''), ''), 99.0)),
              double(coalesce(nullif(feature.tags.getOrDefault('maxheight:physical', '').replaceRegex('[^0-9.]', ''), ''), 99.0))
              ]) }
            exclude_when: >
              ${ min([
              double(coalesce(nullif(feature.tags.getOrDefault('maxheight', '').replaceRegex('[^0-9.]', ''), ''), 99.0)),
              double(coalesce(nullif(feature.tags.getOrDefault('maxheight:physical', '').replaceRegex('[^0-9.]', ''), ''), 99.0))
              ]) >= 99.0 }
            type: double
          - key: "maxheight:conditional"

          - key: maxwidth
            value: >
              ${ min([
              double(coalesce(nullif(feature.tags.getOrDefault('maxwidth', '').replaceRegex('[^0-9.]', ''), ''), 99.0)),
              double(coalesce(nullif(feature.tags.getOrDefault('maxwidth:physical', '').replaceRegex('[^0-9.]', ''), ''), 99.0)),
              double(coalesce(nullif(feature.tags.getOrDefault('width', '').replaceRegex('[^0-9.]', ''), ''), 99.0)),
              double(coalesce(nullif(feature.tags.getOrDefault('est_width', '').replaceRegex('[^0-9.]', ''), ''), 99.0))
              ]) }
            exclude_when: >
              ${ min([
              double(coalesce(nullif(feature.tags.getOrDefault('maxwidth', '').replaceRegex('[^0-9.]', ''), ''), 99.0)),
              double(coalesce(nullif(feature.tags.getOrDefault('maxwidth:physical', '').replaceRegex('[^0-9.]', ''), ''), 99.0)),
              double(coalesce(nullif(feature.tags.getOrDefault('width', '').replaceRegex('[^0-9.]', ''), ''), 99.0)),
              double(coalesce(nullif(feature.tags.getOrDefault('est_width', '').replaceRegex('[^0-9.]', ''), ''), 99.0))
              ]) >= 99.0 }
            type: double
          - key: "maxwidth:conditional"

  - id: highway
    features:
      - source: osm
        geometry: line
        min_zoom: 4
        include_when: *include_when
        exclude_when: *exclude_when
        attributes: *attributes
    tile_post_process:
      merge_line_strings:

args:
  minzoom: 4
  maxzoom: 14
